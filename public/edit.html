<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Edit Item</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div class="container">
    <h1>Edit Item</h1>

    <form id="editForm" class="form">
      <label for="editName">Edit Name</label>
      <input id="editName" type="text" required />
      <button class="btn" type="submit">Save</button>
    </form>

    <p id="editMsg" class="msg"></p>

    <div class="nav-links">
      <a class="btn btn-secondary" href="/">← Back</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function loadOne() {
      const res = await fetch("/api/items");
      const items = await res.json();
      const item = items.find(x => x._id === id);
      if (item) document.getElementById("editName").value = item.name;
    }

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("editName").value.trim();

      const res = await fetch(`/api/items/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });

      if (res.ok) {
        document.getElementById("editMsg").textContent = "Saved!";
        document.getElementById("editMsg").className = "msg success";
        window.location.href = "/";
      } else {
        document.getElementById("editMsg").textContent = "Failed to save.";
        document.getElementById("editMsg").className = "msg error";
      }
    });

    loadOne();
  </script>
</body>
</html>
