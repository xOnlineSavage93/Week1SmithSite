<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Edit Item</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div class="container">
    <h1>Edit Item</h1>

    <form id="editForm" class="form">
      <label for="editName">Edit Name</label>
      <input id="editName" type="text" required />
      <button class="btn" type="submit">Save</button>
    </form>

    <p id="editMsg" class="msg"></p>

    <div class="nav-links">
      <a class="btn btn-secondary" href="/">Back</a>
    </div>
  </div>

 
  <script type="module">
    const msg = document.getElementById("editMsg");

    //Must be logged in to edit
    const meRes = await fetch("/api/auth/me", { credentials: "same-origin" });
    const me = await meRes.json();

    if (!me.loggedIn) {
      window.location.href = "/login.html?error=Please log in to edit items";
    }

    //Get id from URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
      msg.textContent = "Missing item id.";
      msg.className = "msg error";
      throw new Error("Missing id");
    }

    // Load current value
    async function loadOne() {
      const res = await fetch("/api/items", { credentials: "same-origin" });
      const items = await res.json();
      const item = items.find(x => x._id === id);

      if (!item) {
        msg.textContent = "Item not found.";
        msg.className = "msg error";
        return;
      }

      document.getElementById("editName").value = item.name;
    }

    //Save update
    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("editName").value.trim();

      const res = await fetch(`/api/items/${id}`, {
        method: "PUT",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });

      // If session expired or not logged in, send to login
      if (res.status === 401) {
        window.location.href = "/login.html?error=Please log in again";
        return;
      }

      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        msg.textContent = "Saved!";
        msg.className = "msg success";
        window.location.href = "/";
      } else {
        msg.textContent = data.error || "Failed to save.";
        msg.className = "msg error";
      }
    });

    loadOne();
  </script>
</body>
</html>
