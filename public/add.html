<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Add to List</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div class="container">
    <h1>Add to List</h1>

    <form id="addForm" class="form">
      <label for="newItem">New Item</label>
      <input id="newItem" type="text" placeholder="Type a new favorite item..." required />
      <button class="btn" type="submit">Add</button>
    </form>

    <p id="addMsg" class="msg"></p>

    <div class="nav-links">
      <a class="btn btn-secondary" href="/">Back</a>
    </div>
  </div>

  <script type="module">
    // Redirect if not logged in
    const me = await (await fetch("/api/auth/me")).json();
    if (!me.loggedIn) window.location.href = "/login.html?error=Please log in first";

    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("newItem").value.trim();

      const res = await fetch("/api/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });

      const addMsg = document.getElementById("addMsg");

      if (res.ok) {
        addMsg.textContent = "Item added!";
        addMsg.className = "msg success";
        window.location.href = "/";
      } else {
        const data = await res.json().catch(() => ({}));
        addMsg.textContent = data.error || "Failed to add item.";
        addMsg.className = "msg error";
      }
    });
  </script>
</body>
</html>
